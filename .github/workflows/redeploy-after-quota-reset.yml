name: Redeploy after Neon quota reset

# One-shot recovery: Neon's free-tier data-transfer quota was exhausted in
# August 2026, which makes the Vercel build fail (generateStaticParams and
# page prerenders query the DB at build time). The quota resets on the 1st
# of the month. Run this manually (Actions -> Run workflow) AFTER the Vercel
# project is unblocked and Cloudflare is in front (docs/cloudflare-setup.md):
# it pushes an empty commit to trigger a fresh Vercel deploy that picks up
# the frugal build. Not scheduled on purpose — while the project is paused a
# push would only produce a failed-deploy email.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Trigger redeploy after Neon data-transfer quota reset"
          git push
